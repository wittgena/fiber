name: "Bot: Front Gatekeeper"

on:
  pull_request_target:
    types: [opened, reopened]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ One-Shot Sentinel Logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          # 1. Block ANY PR reopens by locking the thread (No Exceptions)
          if [ "$ACTION" == "reopened" ]; then
            echo "Action: PR reopen detected. Locking thread."
            
            gh pr comment $PR_NUMBER --repo $REPO --body "**[System Diagnostic: Request Denied]**
            
            Reopening closed PRs is strictly prohibited in this repository. 
            This thread is now permanently locked. Please open a new PR."
            
            gh pr close $PR_NUMBER --repo $REPO
            gh pr lock $PR_NUMBER --repo $REPO --reason "resolved"
            exit 0
          fi

          # 2. Grant one-time execution label for newly opened PRs
          if [ "$ACTION" == "opened" ]; then
            echo "Action: New PR opened. Granting E2E execution token."
            gh pr edit $PR_NUMBER --repo $REPO --add-label "e2e-approved"
          fi