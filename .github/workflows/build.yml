name: "Fiber CI/CD Pipeline"

on:
  push:
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-e2e-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ❌ Watcher가 제거되었으므로 기존의 'Check E2E Approval Label' 단계는 삭제합니다.

      - name: 📥 Checkout Fiber
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: ⚙️ Install dependencies
        run: |
          pip install uv hatch
          uv pip install --system -e .[dev]

      - name: 🗺️ Bootstrap Topology Boundary
        run: |
          python -m xphi.kernel.space.bind.around

      - name: 🧪 Run System E2E Suite
        env:
          REDIS_URL: "redis://localhost:6379/0" 
          XPHI_ENV: "ci"
        run: |
          fiber e2e dphi.wasm.entry