name: "Fiber CI/CD Pipeline"
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:

jobs:
  # [Phase 1: Testing] Dynamically bind dependencies and verify functional integrity
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Fiber (Current PR/Branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚙️ Install dependencies & Test
        run: |
          pip install uv hatch
          
          # Explicitly instruct 'uv' to use the isolated system environment provided by setup-python
          uv pip install --system -e .[dev]
          
          # Execute test suite
          # pytest

  # [Phase 2: Release] Build pure, deterministic Wheel for external distribution
  build-release:
    needs: integration-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Fiber
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Build Deterministic Wheel
        env:
          # Trigger strictly remote dependency lock in hatch hook (CASE A)
          FIBER_BUILD_DIST: "1" 
        run: |
          pip install hatch
          hatch build

      # [CRITICAL] Upload artifacts so the local act orchestrator (DeterminismAuditor) can extract and inspect them
      - name: 📤 Upload Artifacts for Auditor
        uses: actions/upload-artifact@v4
        with:
          name: fiber-release-wheel
          path: dist/*.whl

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*