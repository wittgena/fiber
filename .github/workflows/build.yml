name: "Fiber CI/CD Pipeline"

on:
  push:
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: \({{ github.workflow }}-\){{ github.ref }}
  cancel-in-progress: true

jobs:
  system-e2e-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Fiber
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout fiber-compats (Fixtures)
        uses: actions/checkout@v4
        with:
          repository: wittgena/fiber-compats
          path: fiber-compats

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Node.js (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler

      - name: Install dependencies
        run: |
          pip install uv hatch
          uv pip install --system -e .[dev]

      - name: Bootstrap Topology & Initialize Node Keys
        run: |
          python -m xphi.node.space.bind.around
          fiber sign init
          fiber sign status
      
      - name: Boot Node (Background)
        env:
          REDIS_URL: "redis://localhost:6379/0" 
          XPHI_ENV: "ci"
          XPHI_WORKERS: "2"
        run: |
          echo "Starting Node in background..."
          nohup python -u -m xphi.node.ops.boot > node_boot.log 2>&1 &
          echo "NODE_PID=\(!" >>\)GITHUB_ENV

          echo "Waiting for Node to become ready on port 8356..."
          timeout 30 bash -c 'while ! curl -s http://127.0.0.1:8356/v1/compliance/keys > /dev/null; do sleep 1; done'
          echo "Node is fully up and running!"

      - name: Run E2E Edge Test
        env:
          REDIS_URL: "redis://localhost:6379/0" 
          DPHI_ENV: "local"
        run: |
          python -m fiber.dev.e2e.gateway.compliance
          python -m fiber.dev.e2e.gateway.security

      - name: Execute Reaper (Teardown)
        if: always()
        env:
          REDIS_URL: "redis://localhost:6379/0" 
          XPHI_ENV: "ci"
        run: |
          echo "Executing Node Reaper..."
          python -m xphi.node.ops.reaper
          
          if kill -0 ${{ env.NODE_PID }} 2>/dev/null; then
            echo "Reaper did not terminate the process. Forcing kill..."
            kill ${{ env.NODE_PID }} || true
          fi
          echo "Node reaped cleanly."

      - name: Upload Node Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-error-logs
          path: node_boot.log

      - name: Run Remaining E2E Tests
        env:
          REDIS_URL: "redis://localhost:6379/0" 
        run: |
          fiber e2e inter.finops --vcr replay
          fiber e2e inter.wasm.gateway
          fiber e2e inter.wasm.phase
          VCR_MODE=replay python -m fiber.dev.ex.switch
          fiber e2e inter.plane.flare --mode dev
      
      - name: Run E2E Concurrency & Load Benchmark
        env:
          REDIS_URL: "redis://localhost:6379/0" 
        run: |
          fiber e2e inter.concurrency --vcr replay --concurrency 50

      - name: Run Router Semantic Routing Tests
        env:
          VCR_MODE: replay
          FIBER_COMPATS_DIR: ${{ github.workspace }}/fiber-compats
        run: |
          pytest -v -s dev/trace/llm/tests/router.py