[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiber"
version = "1.1.2"
description = "The Universal Integration Boundary for heterogeneous AI ecosystems"
readme = "README.md"
requires-python = ">=3.10"

dynamic = ["dependencies"]

[project.scripts]
fiber = "fiber.phase.cli.main:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.metadata.hooks.custom]
path = "phase/hatch.py"

base_dependencies = [
    "uvloop", "fastapi", "redis", "trio", "networkx", "pyyaml", 
    "watchdog", "rocksdict", "transformers", "libcst", 
    "datamodel-code-generator", "acp", "mcp==2.0.0a3", "tyro", "web3",
    "pydantic", "httpx"
]

[tool.hatch.build.targets.wheel]
packages = ["fiber"]