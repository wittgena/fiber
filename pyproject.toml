[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brane"
version = "0.1.0"
description = "The Universal Integration Boundary for heterogeneous AI ecosystems"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "uvloop", "fastapi", "redis", "trio", "networkx", "pyyaml", 
    "watchdog", "rocksdict", "transformers", "libcst", 
    "datamodel-code-generator", "acp", "mcp==2.0.0a3", "tyro", 
    "pydantic", "httpx"
]

[project.optional-dependencies]
readers = ["PyJWT", "pypdf", "python-docx"]
dev = ["pytest", "pytest-asyncio"]
all = ["brane[readers,dev]"]

[project.scripts]
anchor-bind = "brane.anchor.bind.around:run_around"

# 1. 빌드 훅 연결 (요청하신 anchor.bind 하위 경로, _ 미사용)
[tool.hatch.build.hooks.custom]
path = "anchor/bind/hatch.py"

# 2. 로컬 Native 패키지들의 가상 경로 맵핑
[tool.hatch.build.targets.wheel]
packages = ["anchor", "bound", "xphi"]

[tool.hatch.build.targets.wheel.sources]
"anchor" = "brane/anchor"
"bound"  = "brane/bound"
"xphi"   = "brane/xphi"