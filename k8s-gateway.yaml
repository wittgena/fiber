apiVersion: v1
kind: Service
metadata:
  name: fiber-tunnel
  namespace: fiber-topos
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiber-tunnel
  namespace: fiber-topos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 2
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: fiber-gateway
  namespace: fiber-topos
spec:
  selector:
    app: fiber-gateway
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiber-gateway
  namespace: fiber-topos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiber-gateway
  template:
    metadata:
      labels:
        app: fiber-gateway
    spec:
      volumes:
      - name: artifact-volume
        emptyDir: {}
      containers:
      - name: gateway
        image: fiber-node:local
        imagePullPolicy: Never
        command: ["fiber", "daemon", "-s", "rest_edge"]
        env:
        - name: XPHI_ENV
          value: "ci"
        - name: VCR_MODE
          value: "live"
        - name: NODE_PROFILE
          value: "EDGE"
        - name: REDIS_URL
          value: "redis://fiber-tunnel:6379/0"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: artifact-volume
          mountPath: /artifact_mount
